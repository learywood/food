<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes</title>
<style>
  :root { --bg:#faf8f4; --card:#fff; --ink:#2b2620; --muted:#8a8177; --line:#e8e2d8; --acc:#b3541e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 20px; }
  header h1 { margin:0 0 10px; font-size:22px; }
  header h1 small { color:var(--muted); font-weight:400; font-size:14px; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; }
  input[type=search] { flex:1 1 220px; padding:9px 12px; font-size:15px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .filters { display:flex; gap:6px; }
  .filters button { padding:9px 14px; border:1px solid var(--line); border-radius:999px; background:#fff; cursor:pointer; font-size:14px; color:var(--muted); }
  .filters button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  main { padding:20px; max-width:1400px; margin:0 auto; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .08s, box-shadow .08s; }
  .card:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.08); }
  .thumb { aspect-ratio:4/3; background:#efe9df; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .card-body { padding:12px 14px 14px; }
  .card-body h2 { margin:0 0 6px; font-size:16px; }
  .meta { font-size:13px; color:var(--muted); }
  .badge { display:inline-block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:1px; }
  .badge.trial { background:#fdf0e2; color:var(--acc); }
  .badge.tested { background:#e8f3e4; color:#3c7a34; }
  .badge.stable { background:#eee; color:var(--muted); }
  #overlay { position:fixed; inset:0; background:rgba(30,25,20,.5); display:none; overflow-y:auto; padding:24px 12px; }
  #overlay.open { display:block; }
  #sheet { background:#fff; max-width:720px; margin:0 auto; border-radius:14px; overflow:hidden; }
  #sheet img.hero { width:100%; max-height:340px; object-fit:cover; display:block; }
  #sheet .pad { padding:22px 24px 28px; }
  #sheet h2 { margin:0 0 4px; font-size:24px; }
  #sheet h3 { margin:22px 0 8px; font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  #sheet ul, #sheet ol { margin:0; padding-left:22px; }
  #sheet li { margin-bottom:5px; }
  .callout { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:14px; }
  .trial { border-left:3px solid var(--acc); padding:6px 0 6px 12px; margin-bottom:14px; }
  .trial h4 { margin:0 0 4px; font-size:14px; }
  .trial p { margin:2px 0; font-size:14px; }
  #close { float:right; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; }
  a.src { font-size:14px; }
  #empty { text-align:center; color:var(--muted); padding:60px 0; display:none; }
</style>
</head>
<body>
<header>
  <h1>Recipes <small id="count"></small></h1>
  <div class="controls">
    <input id="q" type="search" placeholder="Search recipes, ingredients…" autocomplete="off">
    <div class="filters" id="filters">
      <button data-f="all" class="on">All</button>
      <button data-f="stable">Stable</button>
      <button data-f="tested">Tested</button>
      <button data-f="trial">Trials</button>
    </div>
  </div>
</header>
<main>
  <div id="grid"></div>
  <p id="empty">No recipes match.</p>
</main>
<div id="overlay"><div id="sheet"></div></div>
<script>
let RECIPES = [], filter = 'all', query = '';
const grid = document.getElementById('grid'),
      overlay = document.getElementById('overlay'),
      sheet = document.getElementById('sheet');

fetch('data.json').then(r => r.json()).then(d => {
  RECIPES = d.recipes;
  document.getElementById('count').textContent = d.count + ' dishes';
  render();
});

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function metaLine(m){
  const bits = [];
  if (m.serves) bits.push('Serves ' + esc(m.serves));
  if (m.oven) bits.push(esc(m.oven));
  if (m.bake) bits.push(esc(m.bake));
  if (m.time) bits.push(esc(m.time));
  return bits.join(' · ');
}
function matches(r){
  if (filter !== 'all' && r.status !== filter) return false;
  if (!query) return true;
  const hay = (r.title + ' ' + r.ingredients.join(' ') + ' ' + r.method.join(' ')).toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function render(){
  grid.innerHTML = '';
  let n = 0;
  for (const r of RECIPES){
    if (!matches(r)) continue;
    n++;
    const el = document.createElement('div');
    el.className = 'card';
    const img = r.photo ? `<img loading="lazy" src="${esc(r.photo)}" alt="">` : '<span>no photo</span>';
    el.innerHTML = `<div class="thumb">${img}</div>
      <div class="card-body"><h2>${esc(r.title)}<span class="badge ${r.status}">${r.status}</span></h2>
      <div class="meta">${metaLine(r.meta)}${r.ingredients.length ? ' · ' + r.ingredients.length + ' ingredients' : ''}</div></div>`;
    el.onclick = () => openRecipe(r);
    grid.appendChild(el);
  }
  document.getElementById('empty').style.display = n ? 'none' : 'block';
}
function openRecipe(r){
  const img = r.photo ? `<img class="hero" src="${esc(r.photo)}" alt="">` : '';
  sheet.innerHTML = `${img}<div class="pad">
    <button id="close">Close</button>
    <h2>${esc(r.title)} <span class="badge ${r.status}">${r.status}</span></h2>
    <div class="meta">${metaLine(r.meta)}</div>
    ${r.prep.length ? `<h3>Advance prep</h3><ul>${r.prep.map(i=>`<li>${md(i)}</li>`).join('')}</ul>` : ''}
    ${r.ingredients.length ? `<h3>Ingredients</h3><ul>${r.ingredients.map(i=>`<li>${md(i)}</li>`).join('')}</ul>` : ''}
    ${r.method.length ? `<h3>Method</h3><ol>${r.method.map(i=>`<li>${md(i)}</li>`).join('')}</ol>` : ''}
    ${r.notes.length ? `<h3>Notes</h3><ul>${r.notes.map(i=>`<li>${md(i)}</li>`).join('')}</ul>` : ''}
    ${r.trials.length ? `<h3>Trial log</h3>` + r.trials.map(t =>
      `<div class="trial"><h4>${esc(t.title)}</h4>${t.lines.map(l=>`<p>${md(l)}</p>`).join('')}</div>`).join('') : ''}
    ${r.to_try.length ? `<h3>To try</h3><div class="callout"><ul>${r.to_try.map(i=>`<li>${md(i)}</li>`).join('')}</ul></div>` : ''}
    ${r.source ? `<h3>Source</h3><a class="src" href="${esc(r.source)}" target="_blank" rel="noopener">${esc(r.source)}</a>` : ''}
  </div>`;
  overlay.classList.add('open');
  document.getElementById('close').onclick = () => overlay.classList.remove('open');
  overlay.scrollTop = 0;
}
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.remove('open'); });
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
</script>
</body>
</html>
